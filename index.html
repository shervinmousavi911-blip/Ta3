    });

    function getCityCoords(cityName, stateCode) {
      if (!cityName) return { lat: 41.8781, lng: -87.6298, state: 'IL', county: 'Cook' };
      const match = ALL_SUPPORTED_CITIES.find(c => c.city.toLowerCase() === cityName.toLowerCase());
      if (match) return match;
      const st = (stateCode || 'IL').toUpperCase();
      const stCoord = STATE_COORDS[st] || STATE_COORDS['IL'];
      let hash = 0;
      for (let i = 0; i < cityName.length; i++) {
        hash = (hash << 5) - hash + cityName.charCodeAt(i);
        hash |= 0;
      }
      return {
        lat: Number((stCoord.lat + (((Math.abs(hash) % 100) - 50) / 400)).toFixed(4)),
        lng: Number((stCoord.lng + ((((Math.abs(hash) >> 2) % 100) - 50) / 400)).toFixed(4)),
        state: st,
        county: `${cityName} Area`
      };
    }

    // --- DETERMINISTIC PREDICTIVE RISK INDEX FORMULA ---
    function calculatePredictiveRiskIndex({ severityWeight, accidentCount, roadFactorWeight, weatherFactor, lightingFactor, mitigations = 0 }) {
      const baseNumerator = severityWeight * accidentCount;
      const baseDenominator = Math.max(0.4, roadFactorWeight);
      const rawScore = (baseNumerator / baseDenominator) * weatherFactor * lightingFactor * 2.8;
      const mitigatedScore = rawScore * (1 - mitigations);
      return Math.min(100, Math.max(2, Math.round(mitigatedScore)));
    }

      const markersGroupRef = useRef(null);
      const heatLayerRef = useRef(null);

      const datasetRecords = useMemo(() => {
        return generateDatasetRecordsForDate(activeDateStr, cityName, stateName, lat, lng);
      }, [activeDateStr, cityName, stateName, lat, lng]);

      const handleDateSelect = (newDate) => {
        if (!newDate) return;
        setInternalDate(newDate);
        if (onDateChange) {
          onDateChange(newDate);
        }
      };

      const stepDay = (days) => {
        const d = new Date(activeDateStr || Date.now());
        if (!isNaN(d.getTime())) {
          d.setDate(d.getDate() + days);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          handleDateSelect(`${yyyy}-${mm}-${dd}`);
        }
      };

      const dayFormatted = useMemo(() => {
        try {
          const d = new Date(activeDateStr);
          if (isNaN(d.getTime())) return '';
          const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
          return d.toLocaleDateString('en-US', options);
        } catch (e) {
          return activeDateStr;
        }
      }, [activeDateStr]);

      const hotspots = useMemo(() => {
        return datasetRecords.map((r) => {
          const hour = parseInt(r.Start_Time.split(' ')[1].split(':')[0], 10);
          return {
            id: r.ID,
            lat: r.Start_Lat,
            lng: r.Start_Lng,
            hour,
            severity: r.Severity,
            riskScore: r.Severity >= 4 ? 92 : r.Severity === 3 ? 75 : r.Severity === 2 ? 52 : 34,
            weather: `${r['Temperature(F)']}°F, ${r.Weather_Condition}`,
            roadType: r.Street,
            date: activeDateStr,
            record: r
          };
        });
      }, [datasetRecords, activeDateStr]);

      const filteredHotspots = useMemo(() => {
        if (selectedHour === -1) return hotspots;
        return hotspots.filter(h => h.hour === selectedHour || Math.abs(h.hour - selectedHour) <= 1);
      }, [hotspots, selectedHour]);

      useEffect(() => {
        let interval;
        if (isPlaying) {
          interval = setInterval(() => {
            setSelectedHour(prev => (prev >= 23 ? 0 : prev + 1));
          }, 1200);
        }
        return () => clearInterval(interval);
      }, [isPlaying]);

      useEffect(() => {
        if (!mapRef.current) return;
        if (!mapInstanceRef.current && window.L) {
          const map = L.map(mapRef.current, { zoomControl: false, attributionControl: false }).setView([lat, lng], 12);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
          L.control.zoom({ position: 'topright' }).addTo(map);
          mapInstanceRef.current = map;
          markersGroupRef.current = L.layerGroup().addTo(map);
        } else if (mapInstanceRef.current) {
          mapInstanceRef.current.setView([lat, lng], 12);
        }
      }, [lat, lng]);

      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map || !window.L) return;

        setTimeout(() => { map.invalidateSize(); }, 150);

        if (markersGroupRef.current) markersGroupRef.current.clearLayers();
        if (heatLayerRef.current) {
          try { map.removeLayer(heatLayerRef.current); } catch (e) {}
          heatLayerRef.current = null;
        }

        if (viewMode === 'cluster') {
          filteredHotspots.forEach(pt => {
            const color = pt.riskScore > 70 ? '#ef4444' : pt.riskScore > 45 ? '#f59e0b' : '#10b981';

              radius: 8 + pt.severity * 2,

              weight: 2,
              fillOpacity: 0.85

        } else if (viewMode === 'heatmap') {

            heatCircle.bindPopup(`
              <div style="font-family: sans-serif; color: #f8fafc; background: #0f172a; padding: 10px; border-radius: 8px; font-size: 11px;">

                <div><b>Time Slot:</b> ${pt.hour}:00</div>
              </div>
            `);
            markersGroupRef.current.addLayer(heatCircle);
          });
        }
      }, [filteredHotspots, viewMode]);

      return (

    // --- DATASET RECORDS GENERATOR & INSPECTOR (US_Accidents_March23.csv - 47 Columns) ---
    function generateDatasetRecordsForDate(dateStr, cityName, stateName, centerLat, centerLng) {
      const records = [];
      const baseDate = dateStr || '2023-03-15';
      
      let seed = 0;
      const seedStr = cityName + baseDate + 'US_Accidents_March23_v1';
      for (let i = 0; i < seedStr.length; i++) {
        seed += seedStr.charCodeAt(i) * (i + 1);
      }

      const count = 12;

      const streets = [
        `I-70 E`, `Brice Rd`, `State Route 32`, `I-75 S`, `Miamisburg Centerville Rd`,
        `Westerville Rd`, `Oakridge Dr`, `N Main St`, `I-10 W`, `Wilshire Blvd`,
        `US-101 N`, `I-95 S`, `Broadway`, `Michigan Ave`, `I-90 E`
      ];

      const weatherConds = ['Light Rain', 'Mostly Cloudy', 'Clear', 'Overcast', 'Fair', 'Heavy Rain', 'Fog', 'Light Snow'];
      const windDirs = ['SW', 'Calm', 'SSW', 'WSW', 'NW', 'NE', 'VAR'];

      for (let i = 0; i < count; i++) {
        const recordSeed = seed + i * 1337;
        const hour = (i * 2 + (recordSeed % 7)) % 24;
        const minute = (recordSeed * 13) % 60;
        const durationMins = 30 + (recordSeed % 120);

        const startTimeStr = `${baseDate} ${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00`;
        
        const endD = new Date(`${baseDate}T${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:00`);
        endD.setMinutes(endD.getMinutes() + durationMins);
        const endHour = String(endD.getHours()).padStart(2,'0');
        const endMin = String(endD.getMinutes()).padStart(2,'0');
        const endDateStr = endD.toISOString().split('T')[0];
        const endTimeStr = `${endDateStr} ${endHour}:${endMin}:00`;

        const angle = ((i * 41 + recordSeed) % 360) * (Math.PI / 180);
        const distRad = (0.002 + ((recordSeed % 80) / 1000));
        const sLat = +(centerLat + Math.sin(angle) * distRad).toFixed(6);
        const sLng = +(centerLng + Math.cos(angle) * distRad).toFixed(6);
        const eLat = +(sLat + 0.0005 * (i % 2 === 0 ? 1 : -1)).toFixed(6);
        const eLng = +(sLng + 0.0005 * (i % 3 === 0 ? 1 : -1)).toFixed(6);

        const severity = (recordSeed % 4) + 1; // 1, 2, 3, 4
        const distanceMi = +((0.01 + (recordSeed % 150) / 100)).toFixed(2);
        const street = streets[recordSeed % streets.length];
        const desc = `Accident on ${street} near ${cityName}. ${severity >= 3 ? 'Right lane blocked due to collision, heavy delays.' : 'Traffic slowdown expect delays.'}`;

        const temp = +(45 + (recordSeed % 40) - (hour < 6 || hour > 20 ? 10 : 0)).toFixed(1);
        const windChill = +(temp - 3.5).toFixed(1);
        const humidity = +(40 + (recordSeed % 55)).toFixed(1);
        const pressure = +(29.50 + (recordSeed % 50) / 100).toFixed(2);
        const visibility = severity === 4 ? 1.0 : +(5.0 + (recordSeed % 5)).toFixed(1);
        const windSpeed = +(2.0 + (recordSeed % 25)).toFixed(1);
        const precip = severity >= 3 && recordSeed % 2 === 0 ? 0.05 : 0.0;
        const weatherCond = weatherConds[recordSeed % weatherConds.length];

        const isDay = hour >= 6 && hour <= 19 ? 'Day' : 'Night';

        records.push({
          ID: `A-${2000000 + (recordSeed % 5000000)}`,
          Source: recordSeed % 2 === 0 ? 'Source2' : 'Source1',
          Severity: severity,
          Start_Time: startTimeStr,
          End_Time: endTimeStr,
          Start_Lat: sLat,
          Start_Lng: sLng,
          End_Lat: eLat,
          End_Lng: eLng,
          "Distance(mi)": distanceMi,
          Description: desc,
          Street: street,
          City: cityName,
          County: `${cityName} County`,
          State: stateName,
          Zipcode: `${90000 + (recordSeed % 9999)}`,
          Country: 'US',
          Timezone: stateName === 'CA' ? 'US/Pacific' : stateName === 'IL' ? 'US/Central' : 'US/Eastern',
          Airport_Code: `K${cityName.substring(0, 3).toUpperCase()}`,
          Weather_Timestamp: startTimeStr,
          "Temperature(F)": temp,
          "Wind_Chill(F)": windChill,
          "Humidity(%)": humidity,
          "Pressure(in)": pressure,
          "Visibility(mi)": visibility,
          Wind_Direction: windDirs[recordSeed % windDirs.length],
          "Wind_Speed(mph)": windSpeed,
          "Precipitation(in)": precip,
          Weather_Condition: weatherCond,
          Amenity: (recordSeed % 7) === 0,
          Bump: (recordSeed % 19) === 0,
          Crossing: (recordSeed % 3) === 0,
          Give_Way: (recordSeed % 11) === 0,
          Junction: (recordSeed % 2) === 0,
          No_Exit: (recordSeed % 23) === 0,
          Railway: (recordSeed % 13) === 0,
          Roundabout: (recordSeed % 29) === 0,
          Station: (recordSeed % 5) === 0,
          Stop: (recordSeed % 4) === 0,
          Traffic_Calming: (recordSeed % 17) === 0,
          Traffic_Signal: (recordSeed % 3) === 0,
          Turning_Loop: false,
          Sunrise_Sunset: isDay,
          Civil_Twilight: isDay,
          Nautical_Twilight: isDay,
          Astronomical_Twilight: isDay
        });
      }

      return records;
    }

      const [predictionResult, setPredictionResult] = useState(null);
      const [showApiModal, setShowApiModal] = useState(false);
      const [showRagModal, setShowRagModal] = useState(false);
      const [modelStatus, setModelStatus] = useState({
        loaded: true,
        file: 'innoverse_gold_model_7M.pkl',
        dataset: '7.7M US Records',
        status_label: 'ACTIVE_AND_LOADED'
      });

      const cityCoords = useMemo(() => getCityCoords(cityName, stateCode), [cityName, stateCode]);

      const handleDateChange = (dateVal) => {
        setSelectedDate(dateVal);
        if (!dateVal) return;
        const d = new Date(dateVal);
        if (!isNaN(d.getTime())) {
          const m = d.getMonth() + 1;
          setMonth(m);
          const jsDay = d.getDay();
          const pyDay = jsDay === 0 ? 6 : jsDay - 1;
          setDayOfWeek(pyDay);
          runPrediction({ month: m, dayOfWeek: pyDay });
        }
      };

      const handleSelectRecordForML = (record) => {
        if (!record) return;
        if (record.City) setCityName(record.City);
        if (record.State) setStateCode(record.State);
        if (record.Start_Time) {
          const dStr = record.Start_Time.split(' ')[0];
          setSelectedDate(dStr);
          const d = new Date(dStr);
          if (!isNaN(d.getTime())) {
            setMonth(d.getMonth() + 1);
            const jsDay = d.getDay();
            setDayOfWeek(jsDay === 0 ? 6 : jsDay - 1);
          }
        }
        if (record['Temperature(F)'] !== undefined) setTemperature(record['Temperature(F)']);
        if (record['Humidity(%)'] !== undefined) setHumidity(record['Humidity(%)']);
        if (record['Pressure(in)'] !== undefined) setPressure(record['Pressure(in)']);
        if (record['Visibility(mi)'] !== undefined) setVisibility(record['Visibility(mi)']);
        if (record['Wind_Speed(mph)'] !== undefined) setWindSpeed(record['Wind_Speed(mph)']);
        if (record['Distance(mi)'] !== undefined) setDistance(record['Distance(mi)']);
        if (record.Traffic_Signal !== undefined) setHasTrafficSignal(!!record.Traffic_Signal);
        if (record.Crossing !== undefined) setHasCrossing(!!record.Crossing);
        if (record.Junction !== undefined) setHasJunction(!!record.Junction);
        if (record.Give_Way !== undefined) setHasGiveWay(!!record.Give_Way);
        if (record.Railway !== undefined) setHasRailway(!!record.Railway);
        setIsLiveSynced(false);

        const recHour = record.Start_Time ? parseInt(record.Start_Time.split(' ')[1].split(':')[0], 10) : hour;
        if (!isNaN(recHour)) setHour(recHour);

        runPrediction({
          cityName: record.City || cityName,
          stateCode: record.State || stateCode,
          hour: !isNaN(recHour) ? recHour : hour,
          temperature: record['Temperature(F)'],
          windSpeed: record['Wind_Speed(mph)'],
          visibility: record['Visibility(mi)'],
          humidity: record['Humidity(%)'],
          pressure: record['Pressure(in)'],
          distance: record['Distance(mi)'],
          hasTrafficSignal: !!record.Traffic_Signal,
          hasCrossing: !!record.Crossing,
          hasJunction: !!record.Junction,
          hasGiveWay: !!record.Give_Way,
          hasRailway: !!record.Railway
        });

        setActiveTab('risk');
      };

      // Trigger Stacking ML Prediction
      const runPrediction = async (overrides = {}) => {
        setLoading(true);
        const payload = {
          City: overrides.cityName || cityName,
          State: overrides.stateCode || stateCode,
          Hour: overrides.hour !== undefined ? overrides.hour : hour,
          Month: overrides.month !== undefined ? overrides.month : month,
          DayOfWeek: overrides.dayOfWeek !== undefined ? overrides.dayOfWeek : dayOfWeek,
          'Distance(mi)': overrides.distance !== undefined ? overrides.distance : distance,
          'Temperature(F)': overrides.temperature !== undefined ? overrides.temperature : temperature,
          'Wind_Speed(mph)': overrides.windSpeed !== undefined ? overrides.windSpeed : windSpeed,
          'Visibility(mi)': overrides.visibility !== undefined ? overrides.visibility : visibility,
          'Humidity(%)': overrides.humidity !== undefined ? overrides.humidity : humidity,
          'Pressure(in)': overrides.pressure !== undefined ? overrides.pressure : pressure,
          Traffic_Signal: overrides.hasTrafficSignal !== undefined ? overrides.hasTrafficSignal : hasTrafficSignal,
          Crossing: overrides.hasCrossing !== undefined ? overrides.hasCrossing : hasCrossing,
          Junction: overrides.hasJunction !== undefined ? overrides.hasJunction : hasJunction,
          Give_Way: overrides.hasGiveWay !== undefined ? overrides.hasGiveWay : hasGiveWay,
          Railway: overrides.hasRailway !== undefined ? overrides.hasRailway : hasRailway,
          Start_Lat: cityCoords.lat,
          Start_Lng: cityCoords.lng
        };

        try {
          const res = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          setPredictionResult(data);
        } catch (e) {
          console.warn('Prediction API error:', e);
        } finally {
          setLoading(false);
        }
      };

      // Live Weather & TomTom Traffic Fetch
      const fetchLiveWeatherAndTraffic = async (targetCoords = cityCoords) => {
        setLoading(true);
        setTrafficLoading(true);
        try {
          const [wRes, tRes] = await Promise.all([
            fetch(`/api/weather?lat=${targetCoords.lat}&lng=${targetCoords.lng}`),
            fetch(`/api/traffic?lat=${targetCoords.lat}&lng=${targetCoords.lng}`)
          ]);

          let tempVal = temperature;
          let windVal = windSpeed;
          let visVal = visibility;
          let humVal = humidity;
          let pressVal = pressure;

          if (wRes.ok) {
            const data = await wRes.json();
            if (data.temperature_f !== undefined) { tempVal = data.temperature_f; setTemperature(data.temperature_f); }
            if (data.wind_speed_mph !== undefined) { windVal = data.wind_speed_mph; setWindSpeed(data.wind_speed_mph); }
            if (data.visibility_mi !== undefined) { visVal = data.visibility_mi; setVisibility(data.visibility_mi); }
            if (data.humidity !== undefined) { humVal = data.humidity; setHumidity(data.humidity); }
            if (data.pressure_in !== undefined) { pressVal = data.pressure_in; setPressure(data.pressure_in); }
            if (data.source) setWeatherSource(data.source);
            if (data.station_id) setStationId(data.station_id);
            if (data.weather_condition) setWeatherCondition(data.weather_condition);
          }

          if (tRes.ok) {
            const tData = await tRes.json();
            setTrafficData(tData);
          }

          setIsLiveSynced(true);

          runPrediction({
            temperature: tempVal,
            windSpeed: windVal,
            visibility: visVal,
            humidity: humVal,
            pressure: pressVal
          });
        } catch (e) {
          console.warn('Weather & Traffic fetch error:', e);
        } finally {
          setLoading(false);
          setTrafficLoading(false);
        }
      };

      useEffect(() => {
        fetch('/api/model-status')
          .then(r => r.json())
          .then(data => {
            if (data && data.model_name) {
              setModelStatus({
                loaded: data.is_loaded,
                file: data.model_name,
                dataset: data.dataset || '7.7M US Records',
                status_label: data.status_label || 'ACTIVE_AND_LOADED'
              });
            }
          })
          .catch(e => console.warn('Model status check:', e));
        fetchLiveWeatherAndTraffic();
      }, []);

      const applyPreset = (presetName) => {
        setIsLiveSynced(false);
        if (presetName === 'storm') {
          setCityName('Chicago'); setStateCode('IL'); setHour(2); setTemperature(-10); setWindSpeed(50); setVisibility(0.1); setHumidity(98); setPressure(28.10);
          setSelectedDate('2023-01-16'); setMonth(1); setDayOfWeek(4); setDistance(12.5);
          setHasTrafficSignal(true); setHasCrossing(true); setHasJunction(true); setHasGiveWay(false); setHasRailway(false);
          runPrediction({
            cityName: 'Chicago', stateCode: 'IL', hour: 2, temperature: -10, windSpeed: 50, visibility: 0.1, humidity: 98, pressure: 28.10,
            month: 1, dayOfWeek: 4, distance: 12.5,
            hasTrafficSignal: true, hasCrossing: true, hasJunction: true, hasGiveWay: false, hasRailway: false
          });
        } else if (presetName === 'sunny') {
          setCityName('Los Angeles'); setStateCode('CA'); setHour(14); setTemperature(75); setWindSpeed(2); setVisibility(10.0); setHumidity(20); setPressure(29.95);
          setSelectedDate('2023-03-15'); setMonth(3); setDayOfWeek(2); setDistance(0.1);
          setHasTrafficSignal(false); setHasCrossing(false); setHasJunction(false); setHasGiveWay(false); setHasRailway(false);
          runPrediction({
            cityName: 'Los Angeles', stateCode: 'CA', hour: 14, temperature: 75, windSpeed: 2, visibility: 10.0, humidity: 20, pressure: 29.95,
            month: 3, dayOfWeek: 2, distance: 0.1,
            hasTrafficSignal: false, hasCrossing: false, hasJunction: false, hasGiveWay: false, hasRailway: false
          });
        } else if (presetName === 'rain') {
          setCityName('New York'); setStateCode('NY'); setHour(17); setTemperature(52); setWindSpeed(16); setVisibility(2.5); setHumidity(82); setPressure(29.75);
          setSelectedDate('2023-02-14'); setMonth(2); setDayOfWeek(1); setDistance(1.5);
          setHasTrafficSignal(true); setHasCrossing(true); setHasJunction(true); setHasGiveWay(false); setHasRailway(false);
          runPrediction({
            cityName: 'New York', stateCode: 'NY', hour: 17, temperature: 52, windSpeed: 16, visibility: 2.5, humidity: 82, pressure: 29.75,
            month: 2, dayOfWeek: 1, distance: 1.5,
            hasTrafficSignal: true, hasCrossing: true, hasJunction: true, hasGiveWay: false, hasRailway: false
          });
        } else if (presetName === 'fog') {
          setCityName('Miami'); setStateCode('FL'); setHour(6); setTemperature(64); setWindSpeed(6); setVisibility(1.0); setHumidity(92); setPressure(29.90);
          setSelectedDate('2023-03-05'); setMonth(3); setDayOfWeek(6); setDistance(0.8);
          setHasTrafficSignal(false); setHasCrossing(false); setHasJunction(true); setHasGiveWay(false); setHasRailway(false);
          runPrediction({
            cityName: 'Miami', stateCode: 'FL', hour: 6, temperature: 64, windSpeed: 6, visibility: 1.0, humidity: 92, pressure: 29.90,
            month: 3, dayOfWeek: 6, distance: 0.8,
            hasTrafficSignal: false, hasCrossing: false, hasJunction: true, hasGiveWay: false, hasRailway: false
          });
        }
      };

      const calculatedRiskScore = predictionResult ? Math.round(predictionResult.calibrated_prob * 100) : 75;

      return (
        <div dir={lang === 'fa' ? 'rtl' : 'ltr'} className={`min-h-screen pb-20 transition-colors duration-300 ${activeThemeObj.appBg}`}>
          {/* HEADER BAR */}
          <header className={`border-b sticky top-0 z-40 backdrop-blur-md transition-all ${activeThemeObj.headerBg}`}>
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className={`w-10 h-10 ${uiRadius} ${activeThemeObj.iconBg} font-black text-xl flex items-center justify-center shadow-lg ${
                  glowIntensity === 'subtle' ? '' : glowIntensity === 'intense' ? 'shadow-cyan-500/50 glow-cyan ring-2 ring-cyan-400/50' : activeThemeObj.glowClass
                }`}>
                  TV
                </div>
                <div>
                  <h1 className={`text-base font-bold flex items-center gap-2 flex-wrap ${activeThemeObj.id.toLowerCase().includes('white') || activeThemeObj.id.toLowerCase().includes('snow') ? 'text-slate-900' : 'text-slate-100'}`}>
                    <span>{t.appTitle}</span>
                    <span className={`px-2.5 py-0.5 uppercase tracking-wider text-[10px] font-mono ${activeThemeObj.badgeBg} ${uiRadius} shadow-sm flex items-center gap-1`}>
                      <span>✨</span>
                      <span>{activeThemeObj.badge}</span>
                    </span>
                  </h1>
                  <div className="flex items-center gap-2 mt-0.5">
                    <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 text-[11px] font-mono shadow-md">
                      <span className="relative flex h-2 w-2">
                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                      </span>
                      <span className="font-bold text-slate-300">{lang === 'fa' ? 'مدل ML:' : 'ML Model:'}</span>
                      <span className="font-extrabold text-emerald-300 underline font-mono">{modelStatus.file}</span>
                      <span className="px-1 py-0.2 rounded bg-emerald-500 text-slate-950 text-[9px] font-black uppercase tracking-wider">
                        {lang === 'fa' ? 'لودشده و فعال' : 'LOADED'}
                      </span>
                    </div>
                  </div>
                  <p className={`text-xs hidden sm:block mt-0.5 ${activeThemeObj.id.toLowerCase().includes('white') || activeThemeObj.id.toLowerCase().includes('snow') ? 'text-slate-600' : 'text-slate-400'}`}>{t.subtitle}</p>
                </div>
              </div>

              {/* Language, Theme & Action Controls */}
              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => setShowThemeModal(true)}
                  className={`px-3 py-1.5 ${uiRadius} bg-slate-900/90 border ${activeThemeObj.borderAccent} text-xs ${activeThemeObj.accentText} hover:bg-slate-800 transition-all font-mono cursor-pointer flex items-center gap-1.5 shadow-md`}
                >
                  <span>🎨</span>
                  <span className="font-bold">{t.themeCustomizerBtn}</span>
                </button>

                <button
                  onClick={() => setLang(lang === 'en' ? 'fa' : 'en')}
                  className={`px-3 py-1.5 ${uiRadius} bg-slate-900 border border-slate-800 text-xs text-cyan-400 hover:bg-slate-800 transition-all font-mono cursor-pointer`}
                >
                  {lang === 'en' ? 'فارسی' : 'English'}
                </button>

                <button
                  onClick={() => window.print()}
                  className={`px-3 py-1.5 ${uiRadius} bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-bold text-xs shadow hover:brightness-110 transition-all cursor-pointer`}
                >
                  {t.exportPdfBtn}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
            {/* QUICK PRESETS ROW */}
            <div className="flex flex-wrap items-center gap-2 text-xs">
              <span className="text-slate-400 font-semibold">{t.presetLabel}</span>
              <button onClick={() => applyPreset('storm')} className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 cursor-pointer">
                {t.scenario1}
              </button>
              <button onClick={() => applyPreset('sunny')} className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 cursor-pointer">
                {t.scenario2}
              </button>
              <button onClick={() => applyPreset('rain')} className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 cursor-pointer">
                {t.scenario3}
              </button>
              <button onClick={() => applyPreset('fog')} className="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 cursor-pointer">
                {t.scenario4}
              </button>
            </div>

            {/* TAB NAVIGATION */}
            <div className="border-b border-slate-800 flex flex-wrap gap-2 text-xs font-semibold">
              <button
                onClick={() => setActiveTab('map')}
                className={`px-4 py-2.5 border-b-2 transition-all cursor-pointer ${
                  activeTab === 'map' ? 'border-cyan-500 text-cyan-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                {t.tabMapAnalysis}
              </button>

              <button
                onClick={() => setActiveTab('dataset')}
                className={`px-4 py-2.5 border-b-2 transition-all cursor-pointer flex items-center gap-1.5 ${
                  activeTab === 'dataset' ? 'border-amber-500 text-amber-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>📊</span>
                <span>{lang === 'fa' ? 'دیتاست US_Accidents (۴۷ ستون)' : 'Dataset 47 Columns'}</span>
              </button>

              <button
                onClick={() => setActiveTab('risk')}
                className={`px-4 py-2.5 border-b-2 transition-all cursor-pointer ${
                  activeTab === 'risk' ? 'border-cyan-500 text-cyan-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                {t.tabPredictiveRisk}
              </button>

              <button
                onClick={() => setActiveTab('simulator')}
                className={`px-4 py-2.5 border-b-2 transition-all cursor-pointer ${
                  activeTab === 'simulator' ? 'border-cyan-500 text-cyan-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                {t.tabWhatIfSimulator}
              </button>

              <button
                onClick={() => setActiveTab('trip')}
                className={`px-4 py-2.5 border-b-2 transition-all cursor-pointer flex items-center gap-1.5 ${
                  activeTab === 'trip' ? 'border-purple-500 text-purple-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                <span>{lang === 'fa' ? 'دستیار مشاور سفر' : 'Trip Safety Advisor'}</span>
              </button>
            </div>

            {/* MAIN CONTENT GRID */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              {/* LEFT CONTROL PANEL (4 Columns) */}
              <div className="lg:col-span-4 space-y-6">
                <form onSubmit={(e) => { e.preventDefault(); runPrediction(); }} className="glass-card p-5 rounded-2xl space-y-5">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-cyan-400 border-b border-slate-800 pb-2">
                    {t.geoHeader}
                  </h3>

                  <SearchableCityInput
                    value={cityName}
                    onChangeCity={(val) => { setCityName(val); setIsLiveSynced(false); }}
                    onSelectCity={(item) => {
                      setCityName(item.city);
                      setStateCode(item.state);
                      setIsLiveSynced(false);
                      runPrediction({ cityName: item.city, stateCode: item.state });
                    }}
                    t={t}
                  />

                  <div className="space-y-1">
                    <label className="block text-xs font-medium text-slate-400">{t.stateLabel}</label>
                    <input
                      type="text"
                      value={stateCode}
                      onChange={(e) => { setStateCode(e.target.value.toUpperCase()); setIsLiveSynced(false); }}
                      className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono"
                    />
                  </div>

                  {/* DATE & TEMPORAL SELECTION PANEL */}
                  <div className="pt-2 border-t border-slate-800 space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-purple-400 flex items-center justify-between">
                      <span>{lang === 'fa' ? 'انتخاب تاریخ و زمان تقویم' : 'Date & Temporal Calendar'}</span>
                      <span className="text-[10px] text-slate-500 font-mono">Month: {month} | Day: {dayOfWeek}</span>
                    </h3>

                    <div className="space-y-2 text-xs">
                      <div>
                        <label className="text-slate-400 block mb-1">{lang === 'fa' ? 'تاریخ تقویم رویداد:' : 'Exact Calendar Date:'}</label>
                        <input
                          type="date"
                          value={selectedDate}
                          onChange={(e) => handleDateChange(e.target.value)}
                          className="w-full bg-slate-950 border border-purple-500/40 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono text-xs cursor-pointer focus:border-purple-400"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-slate-400 block">{lang === 'fa' ? 'ماه سال (1-12):' : 'Month (1-12):'}</label>
                          <select
                            value={month}
                            onChange={(e) => {
                              const m = parseInt(e.target.value, 10);
                              setMonth(m);
                              runPrediction({ month: m });
                            }}
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-100 font-mono"
                          >
                            <option value={1}>1 - January (ژانویه)</option>
                            <option value={2}>2 - February (فوریه)</option>
                            <option value={3}>3 - March (مارس)</option>
                            <option value={4}>4 - April (آوریل)</option>
                            <option value={5}>5 - May (می)</option>
                            <option value={6}>6 - June (ژوئن)</option>
                            <option value={7}>7 - July (ژوئیه)</option>
                            <option value={8}>8 - August (اوت)</option>
                            <option value={9}>9 - September (سپتامبر)</option>
                            <option value={10}>10 - October (اکتبر)</option>
                            <option value={11}>11 - November (نوامبر)</option>
                            <option value={12}>12 - December (دسامبر)</option>
                          </select>
                        </div>

                        <div>
                          <label className="text-slate-400 block">{lang === 'fa' ? 'روز هفته:' : 'Day of Week:'}</label>
                          <select
                            value={dayOfWeek}
                            onChange={(e) => {
                              const d = parseInt(e.target.value, 10);
                              setDayOfWeek(d);
                              runPrediction({ dayOfWeek: d });
                            }}
                            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-100 font-mono"
                          >
                            <option value={0}>Mon / دوشنبه (0)</option>
                            <option value={1}>Tue / سه‌شنبه (1)</option>
                            <option value={2}>Wed / چهارشنبه (2)</option>
                            <option value={3}>Thu / پنج‌شنبه (3)</option>
                            <option value={4}>Fri / جمعه (4)</option>
                            <option value={5}>Sat / شنبه (5)</option>
                            <option value={6}>Sun / یکشنبه (6)</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="text-slate-400 block">{lang === 'fa' ? 'طول قطعه مسیر (مایل - Distance):' : 'Segment Distance (mi):'} {distance} mi</label>
                        <input
                          type="number"
                          step="0.1"
                          min="0.0"
                          max="50.0"
                          value={distance}
                          onChange={(e) => {
                            const val = parseFloat(e.target.value) || 0.1;
                            setDistance(val);
                            runPrediction({ distance: val });
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-800 space-y-3">
                    <div className="flex justify-between items-center">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                        <span>{lang === 'fa' ? 'ایستگاه آب‌وهوای NWS زنده' : 'Live NWS Weather Telemetry'}</span>
                      </h3>
                      {isLiveSynced ? (
                        <span className="px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-mono flex items-center gap-1 font-bold">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                          <span>{lang === 'fa' ? 'همگام‌سازی ایستگاه زنده' : 'NWS Live Sync Active'}</span>
                        </span>
                      ) : (
                        <span className="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-mono flex items-center gap-1 font-bold">
                          <span>{lang === 'fa' ? 'تنظیمات دستی کاربر' : 'Custom Parameters'}</span>
                        </span>
                      )}
                    </div>

                    {/* PROMINENT LARGE GLOWING LIVE WEATHER BUTTON */}
                    <button
                      type="button"
                      onClick={() => fetchLiveWeatherAndTraffic()}
                      disabled={loading || trafficLoading}
                      className={`w-full py-4 px-4 rounded-xl font-bold text-xs uppercase tracking-wider transition-all shadow-2xl flex flex-col items-center justify-center gap-1 cursor-pointer border relative overflow-hidden group ${
                        isLiveSynced
                          ? 'bg-gradient-to-r from-cyan-600 via-blue-600 to-indigo-600 border-cyan-400/60 text-white shadow-cyan-500/20 hover:brightness-110'
                          : 'bg-gradient-to-r from-amber-500 via-orange-600 to-purple-600 border-amber-400/80 text-white shadow-amber-500/40 hover:brightness-110 animate-pulse'
                      }`}
                    >
                      <div className="flex items-center gap-2 z-10">
                        <span className="font-black text-xs sm:text-sm">
                          {loading || trafficLoading
                            ? (lang === 'fa' ? 'در حال دریافت اطلاعات آب‌وهوای ایستگاه NWS...' : 'Fetching NWS Station Telemetry...')
                            : (lang === 'fa' ? `دریافت آب‌وهوای زنده NWS برای ${cityName}` : `Fetch Live NWS Weather Telemetry for ${cityName}`)}
                        </span>
                      </div>
                      <span className="text-[10px] font-mono font-normal opacity-90 z-10 flex items-center gap-1.5">
                        <span>US NOAA / National Weather Service (api.weather.gov)</span>
                      </span>
                    </button>

                    {/* TOMTOM LIVE TRAFFIC TELEMETRY CARD */}
                    {trafficData && trafficData.flow && (
                      <div className="p-3 bg-slate-950/90 rounded-xl border border-slate-800 space-y-2 text-xs font-mono">
                        <div className="flex items-center justify-between text-slate-300 border-b border-slate-800/80 pb-1.5">
                          <span className="flex items-center gap-1 font-bold text-cyan-400">
                            <span>TomTom Traffic Flow:</span>
                          </span>
                          <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                            trafficData.flow.congestion_ratio < 0.6 ? 'bg-red-500/20 text-red-300 border border-red-500/40' :
                            trafficData.flow.congestion_ratio < 0.85 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' :
                            'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                          }`}>
                            {Math.round((trafficData.flow.congestion_ratio || 1.0) * 100)}% {lang === 'fa' ? 'روانی ترافیک' : 'Flow Ratio'}
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2 text-[11px]">
                          <div className="p-1.5 bg-slate-900 rounded border border-slate-800 flex justify-between">
                            <span className="text-slate-400">Current Speed:</span>
                            <span className="font-bold text-amber-300">{trafficData.flow.current_speed_mph || 45} mph</span>
                          </div>
                          <div className="p-1.5 bg-slate-900 rounded border border-slate-800 flex justify-between">
                            <span className="text-slate-400">Free Flow:</span>
                            <span className="font-bold text-emerald-300">{trafficData.flow.free_flow_speed_mph || 55} mph</span>
                          </div>
                        </div>

                        {/* TOMTOM INCIDENTS */}
                        {trafficData.incidents && trafficData.incidents.count > 0 ? (
                          <div className="pt-1 border-t border-slate-800/60 space-y-1">
                            <div className="text-[10px] font-bold text-red-400 uppercase tracking-wider flex items-center justify-between">
                              <span>{lang === 'fa' ? `رخدادهای ترافیکی فعال TomTom (${trafficData.incidents.count}):` : `TomTom Incidents Detected (${trafficData.incidents.count}):`}</span>
                            </div>
                            <div className="max-h-24 overflow-y-auto space-y-1">
                              {trafficData.incidents.incidents.slice(0, 3).map((inc, idx) => (
                                <div key={idx} className="p-1.5 bg-red-950/20 border border-red-500/20 rounded text-[10px] text-red-200 flex items-start gap-1.5">
                                  <span className="font-bold text-red-400 shrink-0">Sev {inc.severity}:</span>
                                  <span className="truncate">{inc.description}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        ) : (
                          <div className="text-[10px] text-emerald-400 font-mono">
                            {lang === 'fa' ? 'هیچ انسداد یا تصادفی توسط TomTom گزارش نشده است' : 'No TomTom traffic jams or closures reported nearby'}
                          </div>
                        )}
                      </div>
                    )}

                    {/* LIVE WEATHER CONDITION DISPLAY */}
                    {weatherCondition && (
                      <div className="flex items-center justify-between text-[11px] font-mono bg-slate-950/90 px-3 py-1.5 rounded-lg border border-slate-800 text-slate-300">
                        <span>{lang === 'fa' ? 'وضعیت آب‌وهوا:' : 'Weather Condition:'} <strong className="text-amber-300">{weatherCondition}</strong></span>
                      </div>
                    )}

                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className="text-slate-400">{t.hourLabel}: {hour}:00</label>
                        <input
                          type="range"
                          min="0"
                          max="23"
                          value={hour}
                          onChange={(e) => setHour(parseInt(e.target.value, 10))}
                          className="w-full accent-cyan-400 cursor-pointer"
                        />
                      </div>

                      <div>
                        <label className="text-slate-400">{t.tempLabel}</label>
                        <input
                          type="number"
                          value={temperature}
                          onChange={(e) => {
                            setTemperature(parseFloat(e.target.value) || 0);
                            setIsLiveSynced(false);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono"
                        />
                      </div>

                      <div>
                        <label className="text-slate-400">{t.windLabel}</label>
                        <input
                          type="number"
                          value={windSpeed}
                          onChange={(e) => {
                            setWindSpeed(parseFloat(e.target.value) || 0);
                            setIsLiveSynced(false);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono"
                        />
                      </div>

                      <div>
                        <label className="text-slate-400">{t.visLabel}</label>
                        <input
                          type="number"
                          step="0.1"
                          value={visibility}
                          onChange={(e) => {
                            setVisibility(parseFloat(e.target.value) || 0);
                            setIsLiveSynced(false);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono"
                        />
                      </div>

                      <div>
                        <label className="text-slate-400">{t.humidLabel}</label>
                        <input
                          type="number"
                          value={humidity}
                          onChange={(e) => {
                            setHumidity(parseFloat(e.target.value) || 0);
                            setIsLiveSynced(false);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono"
                        />
                      </div>

                      <div>
                        <label className="text-slate-400">{t.pressLabel}</label>
                        <input
                          type="number"
                          step="0.01"
                          value={pressure}
                          onChange={(e) => {
                            setPressure(parseFloat(e.target.value) || 0);
                            setIsLiveSynced(false);
                          }}
                          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100 font-mono"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Infrastructure Checkboxes */}
                  <div className="pt-2 border-t border-slate-800 space-y-2">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-400">
                      {t.infraHeader}
                    </h3>

                    <div className="space-y-1.5 text-xs text-slate-300">
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={hasTrafficSignal} onChange={(e) => setHasTrafficSignal(e.target.checked)} className="rounded text-cyan-500" />
                        <span>{t.trafficSignal}</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={hasCrossing} onChange={(e) => setHasCrossing(e.target.checked)} className="rounded text-cyan-500" />
                        <span>{t.crossing}</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={hasJunction} onChange={(e) => setHasJunction(e.target.checked)} className="rounded text-cyan-500" />
                        <span>{t.junction}</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked={hasGiveWay} onChange={(e) => setHasGiveWay(e.target.checked)} className="rounded text-cyan-500" />
                        <span>{t.giveWay}</span>
                      </label>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:brightness-110 text-slate-950 font-bold text-xs uppercase tracking-wider transition-all cursor-pointer shadow-lg glow-cyan"
                  >
                    {loading ? t.btnLoading : t.btnSubmit}
                  </button>
                </form>
              </div>

              {/* RIGHT DISPLAY PANEL (8 Columns) */}
              <div className="lg:col-span-8 space-y-6">
                {activeTab === 'map' && (
                  <div className="space-y-6">
                    <LeafletMapComponent
                      lat={cityCoords.lat}
                      lng={cityCoords.lng}
                      cityName={cityName}
                      stateName={stateCode}
                      selectedDate={selectedDate}
                      onDateChange={handleDateChange}
                      persona={persona}
                      t={t}
                      onSelectRecordForML={handleSelectRecordForML}
                    />
                    <DatasetInspectorTable
                      selectedDate={selectedDate}
                      cityName={cityName}
                      stateName={stateCode}
                      lat={cityCoords.lat}
                      lng={cityCoords.lng}
                      onSelectRecordForML={handleSelectRecordForML}
                      t={t}
                      lang={lang}
                    />
                  </div>
                )}

                {activeTab === 'dataset' && (
                  <DatasetInspectorTable
                    selectedDate={selectedDate}
                    cityName={cityName}
                    stateName={stateCode}
                    lat={cityCoords.lat}
                    lng={cityCoords.lng}
                    onSelectRecordForML={handleSelectRecordForML}
                    t={t}
                    lang={lang}
                  />
                )}

                {activeTab === 'risk' && predictionResult && (
                  <div className="glass-card p-6 rounded-2xl space-y-6">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <div>
                        <h3 className="text-base font-bold text-slate-100">{t.analyticsHeader}</h3>
                        <p className="text-xs text-slate-400">{cityName}, {stateCode} • Stacking ML Pipeline Output</p>
                      </div>

                      <div className={`px-3 py-1 rounded-full text-xs font-bold border ${
                        calculatedRiskScore >= 42 ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
                      }`}>
                        {calculatedRiskScore >= 42 ? t.highRiskBadge : t.lowRiskBadge}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-center space-y-1">
                        <div className="text-[10px] uppercase font-bold text-slate-400">{t.riskProbabilityLabel}</div>
                        <div className="text-4xl font-extrabold font-mono text-cyan-400">{calculatedRiskScore}%</div>
                        <div className="text-[10px] text-slate-500">{t.thresholdDetail}</div>
                      </div>

                      <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-center space-y-1">
                        <div className="text-[10px] uppercase font-bold text-slate-400">{t.decisionCutoff}</div>
                        <div className="text-4xl font-extrabold font-mono text-amber-400">42.15%</div>
                        <div className="text-[10px] text-slate-500">Optimal Isotonic Cutoff</div>
                      </div>
                    </div>

                    <div className="space-y-3">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-300">{t.level1Header}</h4>
                      <p className="text-xs text-slate-400">{t.level1Desc}</p>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                          <div className="text-slate-400 font-medium">{t.xgbName}</div>
                          <div className="text-lg font-bold font-mono text-slate-100 mt-1">
                            {Math.round((predictionResult?.pred_xgb ?? predictionResult?.base_models?.xgb_prob ?? (calculatedRiskScore / 100)) * 100)}%
                          </div>
                        </div>

                        <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                          <div className="text-slate-400 font-medium">{t.lgbName}</div>
                          <div className="text-lg font-bold font-mono text-slate-100 mt-1">
                            {Math.round((predictionResult?.pred_lgb ?? predictionResult?.base_models?.lgb_prob ?? (calculatedRiskScore / 100)) * 100)}%
                          </div>
                        </div>

                        <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                          <div className="text-slate-400 font-medium">{t.catName}</div>
                          <div className="text-lg font-bold font-mono text-slate-100 mt-1">
                            {Math.round((predictionResult?.pred_cat ?? predictionResult?.base_models?.cat_prob ?? (calculatedRiskScore / 100)) * 100)}%
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'simulator' && <WhatIfSimulatorWidget t={t} />}

                {activeTab === 'trip' && (
                  <TripSafetyAdvisorWidget
                    currentCity={cityName}
                    currentState={stateCode}
                    t={t}
                    lang={lang}
                  />
                )}
              </div>
            </div>
          </main>

          {/* RAG KNOWLEDGE BASE MODAL */}
          <RagKnowledgeModal
            isOpen={showRagModal}
            onClose={() => setShowRagModal(false)}
            t={t}
          />

          {/* THEME & STYLING CUSTOMIZER MODAL */}
          <ThemeCustomizerModal
            isOpen={showThemeModal}
            onClose={() => setShowThemeModal(false)}
            currentTheme={currentTheme}
            setCurrentTheme={setCurrentTheme}
            uiRadius={uiRadius}
            setUiRadius={setUiRadius}
            glowIntensity={glowIntensity}
            setGlowIntensity={setGlowIntensity}
            t={t}
            lang={lang}
          />

          {/* FLOATING SAFETY COPILOT WIDGET */}
          <SafetyCopilotWidget
            city={cityName}
            state={stateCode}
            riskIndex={calculatedRiskScore}
            weather={weatherCondition}
            persona={persona}
            t={t}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
